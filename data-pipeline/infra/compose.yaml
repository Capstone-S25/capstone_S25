services:
  postgres:
    image: postgres:18
    container_name: capstone-postgres-dev
    environment:
      POSTGRES_DB: capstone
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: password
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U capstone -d capstone']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
