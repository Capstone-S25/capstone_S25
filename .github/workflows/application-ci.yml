name: Vision application
on:
  push:
    paths: ["app.py", "vision_runtime/**", "data-pipeline/**", "tests/**", "tools/**", "requirements*.txt", "pyproject.toml", ".streamlit/**", ".github/workflows/application-ci.yml"]
  pull_request:
    paths: ["app.py", "vision_runtime/**", "data-pipeline/**", "tests/**", "tools/**", "requirements*.txt", "pyproject.toml", ".streamlit/**", ".github/workflows/application-ci.yml"]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install torch==2.8.0+cpu torchvision==0.23.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip install -e . --no-deps
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest tests -q
