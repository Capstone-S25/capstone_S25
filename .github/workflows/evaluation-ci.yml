name: Evaluation pipeline CI
on:
  push:
    paths: ["app.py", ".streamlit/**", "anomaly_eval/**", "scripts/**", "config/**", "tests/**", "pyproject.toml", "requirements/**", "notebooks/**", ".github/workflows/evaluation-ci.yml"]
  pull_request:
    paths: ["app.py", ".streamlit/**", "anomaly_eval/**", "scripts/**", "config/**", "tests/**", "pyproject.toml", "requirements/**", "notebooks/**", ".github/workflows/evaluation-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/ui.txt
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/base.txt -r requirements/ui.txt ruff==0.17.0
      - run: python -m pip install -e . --no-deps
      - run: ruff check app.py anomaly_eval scripts tests
      - run: ruff format --check app.py anomaly_eval scripts tests
      - run: python -m unittest discover -s tests -v
