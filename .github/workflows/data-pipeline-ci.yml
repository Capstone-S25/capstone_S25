name: Evaluation pipeline CI
on:
  push:
    paths: ["anomaly_eval/**", "scripts/**", "config/**", "tests/**", "pyproject.toml", "requirements/**", "notebooks/**", ".github/workflows/data-pipeline-ci.yml"]
  pull_request:
    paths: ["anomaly_eval/**", "scripts/**", "config/**", "tests/**", "pyproject.toml", "requirements/**", "notebooks/**", ".github/workflows/data-pipeline-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/base.txt
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/base.txt ruff==0.16.10
      - run: python -m pip install -e . --no-deps
      - run: ruff check anomaly_eval scripts tests
      - run: ruff format --check anomaly_eval scripts tests
      - run: python -m unittest discover -s tests -v
